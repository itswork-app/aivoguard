name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  foundation:
    name: Repository foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Run deterministic M01 example
        run: |
          output="$(cargo run --quiet --example deterministic_transfer)"
          expected="$(printf 'disposition: AcceptedEffective\\neffects: 2\\nalice USD minor units: 8500\\nbob USD minor units: 1500')"
          test "$output" = "$expected"
          printf '%s\\n' "$output"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
