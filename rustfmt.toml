# Formatting policy for the AivoGuard workspace.
# Enforced locally via `cargo fmt --check` and in CI.

edition = "2021"
style_edition = "2021"
max_width = 100
use_small_heuristics = "Default"
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
